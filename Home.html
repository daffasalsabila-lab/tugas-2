<!DOCTYPE html>
<html lang="en">

</head>

<body>

    <!-- Navbar -->
    <header>
        <div class="nav-container">
            <h2 class="logo">Daffa Salsabila</h2>

            <p>
                Hi, saya adalah developer yang saat ini sedang belajar HTML,
                CSS, dan Javascript.
            </p>
            <!-- Gallery -->
            <div class="gallery">
                <figure>
                    <figcaption>Skills</figcaption>
                    <p>Saya bisa ngoding "Hello World"</p>
                </figure>

                <figure>
                    <figcaption>Pengalaman</figcaption>
                    <p>Saya bisa bismillah</p>
                </figure>
            </div>
        </div>
    </section>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 @Daffa_Salsabila</p>
    </footer>
    <script>
        function toogleMenu() {
            document.getElementById('menu').classList.toggle('tampil');
        }
    </script>
</body>
</html>
